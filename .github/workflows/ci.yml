# Raphael's continuous integration.
#
#   lint        ruff over src/ and tests/
#   test        the test suite, without and with the gpu extra (Kilosort,
#               suite2p, torch), on GitHub's CPU runners
#   downstream  each project that depends on Raphael, installed as its own
#               uv.lock pins it, with this Raphael swapped in, running the
#               project's own tests: a change that breaks a project fails
#               here, before it is released
#
# Free: Raphael is public, so GitHub Actions minutes are unlimited.
# The projects are listed in .github/downstream/, one file each: add a file
# to link a project (docs/ci.md; private projects need a read-only token).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'        # Mondays 06:00 UTC: catches projects that changed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests .github/scripts

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            extras: --extra dev
          - name: gpu extra, on CPU
            extras: --extra dev --extra gpu
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Free disk space for torch and CUDA wheels
        if: contains(matrix.extras, 'gpu')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: uv sync --frozen ${{ matrix.extras }}
      - run: uv run --frozen pytest -q -rs

  discover:
    name: find downstream projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      count: ${{ steps.read.outputs.count }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - id: read
        run: uv run --no-project --with pyyaml python .github/scripts/downstream_matrix.py --github

  downstream:
    name: downstream (${{ matrix.name }})
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Access to ${{ matrix.repo }}
        id: access
        if: matrix.private
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::warning::${{ matrix.repo }} is private and pull requests from forks get no secrets: not tested here"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::${{ matrix.repo }} is private: add a read-only token as the DOWNSTREAM_TOKEN secret (docs/ci.md)"
            exit 1
          fi
      - name: Check out this Raphael
        if: steps.access.outputs.skip != 'true'
        uses: actions/checkout@v7.0.1
        with:
          path: raphael
      - name: Check out ${{ matrix.repo }}
        if: steps.access.outputs.skip != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          path: project
          token: ${{ matrix.private && secrets.DOWNSTREAM_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.access.outputs.skip != 'true'
        with:
          enable-cache: true
      - name: Install the project as its uv.lock pins it
        if: steps.access.outputs.skip != 'true'
        working-directory: project
        run: |
          uv sync --frozen ${{ matrix.extras_flags }}
          uv pip show --python .venv raphael > /dev/null 2>&1 || {
            echo "::error::${{ matrix.repo }} does not install raphael: add it to its dependencies, or set enabled: false in .github/downstream/${{ matrix.name }}.yml"
            exit 1; }
      - name: Swap in this Raphael
        if: steps.access.outputs.skip != 'true'
        working-directory: project
        # --python .venv: always the project's environment, whatever else is active.
        # The check fails the job unless raphael now imports from this checkout.
        run: |
          uv pip install --python .venv -e ../raphael
          uv run --no-sync python -c "import raphael, pathlib; p = pathlib.Path(raphael.__file__).resolve(); print('raphael', raphael.__version__, 'from', p); assert pathlib.Path('../raphael').resolve() in p.parents, 'Raphael was not swapped in'"
      - name: Run the project's tests
        if: steps.access.outputs.skip != 'true'
        working-directory: project
        run: ${{ matrix.test }}
      - name: Who to tell
        if: failure() && matrix.contact != ''
        run: echo "::error::${{ matrix.repo }} broke against this Raphael; tell @${{ matrix.contact }}"
